# StudyMind 生产站点反向代理配置
# 域名: studymind.8xf.pro
#
# 部署拓扑（已确认）:
#   nginx 与 auth 服务同机部署
#     - auth 服务监听本机 127.0.0.1:<AUTH_PORT>（已部署实例）
#     - 本仓库 server 监听本机 127.0.0.1:8788（需另行部署，见 deploy/systemd/）
#
# 路径分流:
#   /api/tasks, /api/progress, /api/workers, /health/*  ->  本仓库 server (8788)
#   其余（含 /login, /api/desktop/*, /）                ->  auth 服务
#
# 部署前必须修改（搜索 <AUTH_PORT> 与证书路径）:
#   1. 将 <AUTH_PORT> 替换为 auth 服务实际监听端口
#   2. 将 ssl_certificate / ssl_certificate_key 替换为实际证书路径
#   3. 若本仓库 server 部署在另一台机器，将 127.0.0.1:8788 改为该机内网地址
#
# 安装:
#   sudo cp deploy/nginx/studymind.8xf.pro.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/studymind.8xf.pro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 首次签发证书（需先注释掉下方 443 server 块，仅保留 80 块的 acme-challenge）:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d studymind.8xf.pro
#   签发成功后取消注释 443 块并 reload
# 续期:
#   sudo certbot renew --webroot -w /var/www/certbot && sudo systemctl reload nginx

# ---------- HTTP: ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name studymind.8xf.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: 路径分流反代 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studymind.8xf.pro;

    # SSL 证书（替换为实际路径）
    ssl_certificate     /etc/letsencrypt/live/studymind.8xf.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studymind.8xf.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 课堂媒体/任务可能上传较大文件
    client_max_body_size 2g;

    # 通用反代头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 长任务（转写等）读取超时放宽
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- 本仓库 server: 业务 API（Fastify :8788）---
    location /api/tasks {
        proxy_pass http://127.0.0.1:8788;
    }
    location /api/progress {
        proxy_pass http://127.0.0.1:8788;
    }
    location /api/workers {
        proxy_pass http://127.0.0.1:8788;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- auth 服务: 登录页 / 桌面端认证 / 兜底 ---
    # 替换 <AUTH_PORT> 为 auth 实际监听端口
    location / {
        proxy_pass http://127.0.0.1:<AUTH_PORT>;
    }
}
