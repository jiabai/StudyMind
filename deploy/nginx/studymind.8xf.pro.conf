# StudyMind 生产站点反向代理配置
# 域名: studymind.8xf.pro
#
# 与 FrameQ 共用同一台 nginx（共存说明）:
#   - 本文件与 frameq-server.conf 同时 enable，两个独立 server 块，server_name 不同不冲突
#   - 均未声明 default_server，不影响其它站点
#   - SSL 共享内存区使用具名 studymind_ssl（FrameQ 用 frameq_ssl），避免全局撞名
#   - 本文件不定义 upstream（直接 proxy_pass 127.0.0.1:8788），与 frameq_server 无名称冲突
#   - ACME 验证共用 /var/www/certbot，按域名分目录，certbot 续期互不影响
#   - 安装时不要覆盖 frameq 的 conf：cp 为本文件名后 ln -s 到 sites-enabled 即可
#
# 部署拓扑（已确认）:
#   nginx 与本仓库 server 同机部署
#     - 本仓库 server（账号/激活/计费服务）监听本机 127.0.0.1:8788
#     - 全部业务路径由本仓库 server 处理，不再依赖外部 auth 服务
#
# 路径白名单（与 server/src/server.ts 注册路由一致）:
#   /health/live, /health/ready  ->  存活/就绪探针
#   /login, /privacy, /terms     ->  登录页与法律页面
#   /auth/*                      ->  桌面端邮箱 OTP 登录
#   /user/*                      ->  Web 用户端 OTP 登录/退出
#   /api/desktop/*               ->  桌面端账号/激活/计费/LLM checkout
#   /api/dashboard/*             ->  Web 用户端账号
#   /api/wechat/notify           ->  微信支付回调（仅 WECHAT_PAY_ENABLED=1 时启用）
#   /admin, /admin/*             ->  管理端
#   其余路径一律 404
#
# 安装:
#   sudo cp deploy/nginx/studymind.8xf.pro.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/studymind.8xf.pro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx   # nginx -t 必须通过（含 frameq conf 一起校验）
#
# 首次签发证书（需先注释掉下方 443 server 块，仅保留 80 块的 acme-challenge）:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d studymind.8xf.pro
#   签发成功后取消注释 443 块并 reload
# 续期:
#   sudo certbot renew --webroot -w /var/www/certbot && sudo systemctl reload nginx

# ---------- HTTP: ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name studymind.8xf.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: 白名单反向代理 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studymind.8xf.pro;

    # SSL 证书（替换为实际路径）
    ssl_certificate     /etc/letsencrypt/live/studymind.8xf.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studymind.8xf.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:studymind_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/studymind.access.log;
    error_log /var/log/nginx/studymind.error.log warn;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体上限: 账号/计费接口均为 JSON，1m 足够
    client_max_body_size 1m;

    # 通用反代头（应用仅在直连 peer 为 loopback 时信任转发链）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # --- 健康探针 ---
    location = /health/live {
        proxy_pass http://127.0.0.1:8788;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- 登录页与法律页面 ---
    location = /login {
        proxy_pass http://127.0.0.1:8788;
    }
    location = /privacy {
        proxy_pass http://127.0.0.1:8788;
    }
    location = /terms {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- 桌面端邮箱 OTP 登录 ---
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- Web 用户端（OTP 登录/退出/仪表盘） ---
    location ^~ /user/ {
        proxy_pass http://127.0.0.1:8788;
    }
    location = /dashboard {
        proxy_pass http://127.0.0.1:8788;
    }
    location ^~ /api/dashboard/ {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- 桌面端账号/激活/计费/LLM checkout ---
    location ^~ /api/desktop/ {
        proxy_pass http://127.0.0.1:8788;
    }

    # 微信支付回调。仅 WECHAT_PAY_ENABLED=1 时需要，未启用时保持此块即可（服务端返回 404）。
    location = /api/wechat/notify {
        proxy_pass http://127.0.0.1:8788;
    }

    # --- 管理端 ---
    location = /admin {
        proxy_pass http://127.0.0.1:8788;
    }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8788;
    }

    # 白名单之外一律 404（不转发到后端）
    location / {
        return 404;
    }
}
