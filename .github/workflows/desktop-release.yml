name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      release_draft:
        description: Create a new release as a draft
        required: false
        type: boolean
        default: true
      build_windows_updater:
        description: Build Windows installer and updater artifacts
        required: false
        type: boolean
        default: true
      build_macos_x64:
        description: Build the Intel macOS DMG
        required: false
        type: boolean
        default: true
      build_macos_arm64:
        description: Build the Apple Silicon macOS DMG
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_draft: ${{ steps.release.outputs.release_draft }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tag and prepare release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_DRAFT: ${{ inputs.release_draft }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$PUSH_TAG"
            REQUESTED_RELEASE_DRAFT=true
          else
            RELEASE_TAG="$INPUT_TAG"
            REQUESTED_RELEASE_DRAFT="$INPUT_RELEASE_DRAFT"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v1.2.3." >&2
            exit 1
          fi
          if [[ "$REQUESTED_RELEASE_DRAFT" != "true" && "$REQUESTED_RELEASE_DRAFT" != "false" ]]; then
            echo "Release draft input must be true or false." >&2
            exit 1
          fi

          APP_VERSION="$(jq -r '.version' app/package.json)"
          TAURI_VERSION="$(jq -r '.version' app/src-tauri/tauri.conf.json)"
          CARGO_VERSION="$(awk -F'\"' '/^version = \"/ { print $2; exit }' app/src-tauri/Cargo.toml)"
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "null" || -z "$TAURI_VERSION" || "$TAURI_VERSION" == "null" || -z "$CARGO_VERSION" ]]; then
            echo "Unable to determine all desktop application versions." >&2
            exit 1
          fi
          if [[ "$APP_VERSION" != "$TAURI_VERSION" || "$APP_VERSION" != "$CARGO_VERSION" ]]; then
            echo "Desktop versions must match: app=$APP_VERSION tauri=$TAURI_VERSION cargo=$CARGO_VERSION." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${APP_VERSION}" ]]; then
            echo "Release tag must match desktop version: expected v${APP_VERSION}, got ${RELEASE_TAG}." >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null

          mapfile -t matching_releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | [.id, .draft] | @tsv"
          )

          if (( ${#matching_releases[@]} > 1 )); then
            echo "Multiple releases already use tag $RELEASE_TAG; remove the duplicates before retrying." >&2
            printf 'Matching release: %s\n' "${matching_releases[@]}" >&2
            exit 1
          elif (( ${#matching_releases[@]} == 1 )); then
            IFS=$'\t' read -r release_id existing_release_draft <<< "${matching_releases[0]}"
            release_draft="$existing_release_draft"
          else
            release_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="StudyMind $RELEASE_TAG" \
              -f body="StudyMind desktop release $RELEASE_TAG" \
              -F draft="$REQUESTED_RELEASE_DRAFT" \
              -F prerelease=false)"
            release_id="$(jq -r '.id' <<< "$release_json")"
            release_draft="$REQUESTED_RELEASE_DRAFT"
          fi

          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Release ID is missing." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_draft=$release_draft" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  windows-updater-artifacts:
    needs: prepare-release
    if: ${{ github.event_name == 'push' || inputs.build_windows_updater }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v5.4.1

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Prepare bundled runtime
        env:
          STUDYMIND_PYTHON_STANDALONE_URL_WINDOWS_X64: ${{ secrets.STUDYMIND_PYTHON_STANDALONE_URL_WINDOWS_X64 }}
          STUDYMIND_FFMPEG_ARCHIVE_URL_WINDOWS_X64: ${{ secrets.STUDYMIND_FFMPEG_ARCHIVE_URL_WINDOWS_X64 }}
        run: |
          $env:STUDYMIND_PYTHON_STANDALONE_URL_WINDOWS_X64 = $env:STUDYMIND_PYTHON_STANDALONE_URL_WINDOWS_X64 -replace '^\uFEFF', ''
          $env:STUDYMIND_FFMPEG_ARCHIVE_URL_WINDOWS_X64 = $env:STUDYMIND_FFMPEG_ARCHIVE_URL_WINDOWS_X64 -replace '^\uFEFF', ''
          node scripts\build-installer.mjs --target windows-x64 --skip-tauri-build

      - name: Build and upload NSIS updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: StudyMind ${{ env.RELEASE_TAG }}
          releaseBody: StudyMind desktop release ${{ env.RELEASE_TAG }}
          releaseDraft: ${{ needs.prepare-release.outputs.release_draft == 'true' }}
          prerelease: false
          releaseCommitish: ${{ needs.prepare-release.outputs.release_tag }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc

      - name: Normalize and replace updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir . --clobber
          node scripts/normalize-updater-manifest.mjs latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber

  macos-x64:
    needs: [prepare-release, windows-updater-artifacts]
    if: ${{ always() && (github.event_name == 'push' || inputs.build_macos_x64) && needs.prepare-release.result == 'success' && (needs.windows-updater-artifacts.result == 'success' || needs.windows-updater-artifacts.result == 'skipped') }}
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v5.4.1

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Prepare bundled runtime
        env:
          STUDYMIND_PYTHON_STANDALONE_URL_MACOS_X64: ${{ secrets.STUDYMIND_PYTHON_STANDALONE_URL_MACOS_X64 }}
          STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_X64: ${{ secrets.STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_X64 }}
          STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_X64: ${{ secrets.STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_X64 }}
        shell: bash
        run: |
          set -euo pipefail
          STUDYMIND_PYTHON_STANDALONE_URL_MACOS_X64="${STUDYMIND_PYTHON_STANDALONE_URL_MACOS_X64#$'\ufeff'}"
          STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_X64="${STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_X64#$'\ufeff'}"
          STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_X64="${STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_X64#$'\ufeff'}"
          export STUDYMIND_PYTHON_STANDALONE_URL_MACOS_X64 STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_X64 STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_X64
          node scripts/build-installer.mjs --target macos-x64 --skip-tauri-build

      - name: Test macOS audio capture
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --target x86_64-apple-darwin audio_capture

      - name: Check Tauri backend
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Build app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix app run tauri -- build --bundles app --target x86_64-apple-darwin

      - name: Smoke-test app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/StudyMind.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP_PATH/Contents/Info.plist")" = "StudyMind records microphone audio for local transcription and study notes."
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$APP_PATH/Contents/Info.plist")" = "StudyMind records system audio for local transcription and study notes. Screen content is not saved."
          RESOURCES="$APP_PATH/Contents/Resources/resources"
          PYTHON="$RESOURCES/python/bin/python3"

          test -x "$PYTHON"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RESOURCES/worker" "$PYTHON" -c "import brotli, funasr, funasr_onnx, modelscope, onnxruntime, yt_dlp, studymind_worker"
          "$RESOURCES/bin/ffmpeg" -version
          "$RESOURCES/bin/ffprobe" -version
          if find "$RESOURCES" \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print -quit | grep -q .; then
            echo "Python cache files must not be bundled." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create DMG
        run: bash scripts/make-macos-dmg.sh x86_64-apple-darwin StudyMind

      - name: Upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg --clobber

  macos-arm64:
    needs: [prepare-release, windows-updater-artifacts]
    if: ${{ always() && (github.event_name == 'push' || inputs.build_macos_arm64) && needs.prepare-release.result == 'success' && (needs.windows-updater-artifacts.result == 'success' || needs.windows-updater-artifacts.result == 'skipped') }}
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v5.4.1

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Prepare bundled runtime
        env:
          STUDYMIND_PYTHON_STANDALONE_URL_MACOS_ARM64: ${{ secrets.STUDYMIND_PYTHON_STANDALONE_URL_MACOS_ARM64 }}
          STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_ARM64: ${{ secrets.STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_ARM64 }}
          STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_ARM64: ${{ secrets.STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_ARM64 }}
        shell: bash
        run: |
          set -euo pipefail
          STUDYMIND_PYTHON_STANDALONE_URL_MACOS_ARM64="${STUDYMIND_PYTHON_STANDALONE_URL_MACOS_ARM64#$'\ufeff'}"
          STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_ARM64="${STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_ARM64#$'\ufeff'}"
          STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_ARM64="${STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_ARM64#$'\ufeff'}"
          export STUDYMIND_PYTHON_STANDALONE_URL_MACOS_ARM64 STUDYMIND_FFMPEG_ARCHIVE_URL_MACOS_ARM64 STUDYMIND_FFPROBE_ARCHIVE_URL_MACOS_ARM64
          node scripts/build-installer.mjs --target macos-arm64 --skip-tauri-build

      - name: Test macOS audio capture
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --target aarch64-apple-darwin audio_capture

      - name: Check Tauri backend
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix app run tauri -- build --bundles app --target aarch64-apple-darwin

      - name: Smoke-test app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/StudyMind.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP_PATH/Contents/Info.plist")" = "StudyMind records microphone audio for local transcription and study notes."
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$APP_PATH/Contents/Info.plist")" = "StudyMind records system audio for local transcription and study notes. Screen content is not saved."
          RESOURCES="$APP_PATH/Contents/Resources/resources"
          PYTHON="$RESOURCES/python/bin/python3"

          test -x "$PYTHON"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RESOURCES/worker" "$PYTHON" -c "import brotli, funasr, funasr_onnx, modelscope, onnxruntime, yt_dlp, studymind_worker"
          "$RESOURCES/bin/ffmpeg" -version
          "$RESOURCES/bin/ffprobe" -version
          if find "$RESOURCES" \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) -print -quit | grep -q .; then
            echo "Python cache files must not be bundled." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create DMG
        run: bash scripts/make-macos-dmg.sh aarch64-apple-darwin StudyMind

      - name: Upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --clobber
