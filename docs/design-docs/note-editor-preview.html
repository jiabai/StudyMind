<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记编辑框改版预览 — StudyMind</title>
<style>
  :root {
    --text: #2a2a24;
    --text-muted: #7c766a;
    --text-soft: #8a857a;
    --primary: #7e9b8a;
    --primary-pressed: #64806f;
    --border: rgba(95, 88, 72, 0.16);
    --border-strong: rgba(95, 88, 72, 0.26);
    --surface-subtle: rgba(245, 241, 232, 0.78);
    --surface-raised: rgba(253, 251, 246, 0.94);
    --shadow-control: 0 1px 0 rgba(255, 255, 255, 0.76) inset, 0 1px 2px rgba(0, 0, 0, 0.06);
    --radius-sm: 6px;
    --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  body {
    background: #f7f5f0;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 32px 24px;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 0.8rem; margin: 0 0 24px; }
  .compare {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    max-width: 920px;
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .panel h2 { font-size: 0.82rem; font-weight: 600; margin: 0 0 4px; }
  .panel .hint { color: var(--text-muted); font-size: 0.72rem; margin: 0 0 14px; }

  /* 笔记卡片（与真实组件一致） */
  .note-record {
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    display: grid;
    gap: 8px;
    padding: 12px;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .note-source { color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; margin: 0; }
  .note-content { color: var(--text); font-size: 0.92rem; line-height: 1.55; margin: 0; white-space: pre-wrap; }
  .note-actions { align-items: center; display: flex; gap: 8px; justify-content: flex-end; }

  /* 按钮（与真实组件一致） */
  .btn {
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 12px;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .btn-primary { background: linear-gradient(180deg, #5f7d6b 0%, var(--primary-pressed) 100%); color: #fff; }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-secondary { background: var(--surface-raised); border-color: var(--border-strong); color: var(--text); }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary-pressed); }

  /* ===== 旧版编辑框：裸 textarea ===== */
  .editor-old {
    min-height: 92px;
    resize: vertical;
    width: 100%;
  }

  /* ===== 新版编辑框：完整质感 ===== */
  .editor-new {
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-control);
    caret-color: var(--primary-pressed);
    color: var(--text);
    font: inherit;
    font-size: 0.92rem;
    line-height: 1.55;
    min-height: 92px;
    outline: none;
    padding: 10px 12px;
    resize: vertical;
    transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    width: 100%;
  }
  .editor-new::placeholder { color: var(--text-muted); opacity: 1; }
  .editor-new:hover:not(:disabled) { border-color: rgba(126, 155, 138, 0.55); }
  .editor-new:focus-visible {
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(126, 155, 138, 0.16), var(--shadow-control);
  }
  .editor-new:disabled { cursor: not-allowed; opacity: 0.55; }

  /* 编辑中的卡片高亮 */
  .note-record:has(.editor-new) {
    border-color: rgba(126, 155, 138, 0.42);
    box-shadow: 0 0 0 3px rgba(126, 155, 138, 0.1);
  }
</style>
</head>
<body>
  <h1>笔记编辑框 · 质感改版预览</h1>
  <p class="sub">左边旧版是浏览器原生裸 textarea，右边新版补齐了背景、边框、圆角、阴影、聚焦态与卡片联动。可点击输入框对比聚焦效果。</p>

  <div class="compare">
    <section class="panel">
      <h2>旧版 <span style="color:#9c554d;">● 裸编辑框</span></h2>
      <p class="hint">无边框无背景，原生样式</p>
      <div class="note-record">
        <p class="note-source">“本节课重点讲解了傅里叶变换的三个性质…”</p>
        <textarea class="editor-old" placeholder="输入笔记内容…">重点：时移性质、频移性质、尺度变换。</textarea>
        <div class="note-actions">
          <button class="btn btn-primary" type="button">保存</button>
          <button class="btn btn-secondary" type="button">取消</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>新版 <span style="color:#5c7868;">● 完整质感</span></h2>
      <p class="hint">聚焦有主题色光环，卡片同步高亮</p>
      <div class="note-record">
        <p class="note-source">“本节课重点讲解了傅里叶变换的三个性质…”</p>
        <textarea class="editor-new" placeholder="输入笔记内容…">重点：时移性质、频移性质、尺度变换。</textarea>
        <div class="note-actions">
          <button class="btn btn-primary" type="button">保存</button>
          <button class="btn btn-secondary" type="button">取消</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
