<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课题列表选中态改版预览 — StudyMind</title>
<style>
  :root {
    --text: #2a2a24;
    --text-soft: #8a857a;
    --primary: #7e9b8a;
    --primary-pressed: #64806f;
    --selected-bg: #5c7868;
    --border: rgba(42, 42, 36, 0.1);
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  body {
    background: #f7f5f0;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 32px 24px;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .sub { color: var(--text-soft); font-size: 0.8rem; margin: 0 0 24px; }
  .compare {
    display: grid;
    gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    max-width: 860px;
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .panel h2 { font-size: 0.82rem; font-weight: 600; margin: 0 0 4px; }
  .panel .hint { color: var(--text-soft); font-size: 0.72rem; margin: 0 0 14px; }
  .panel .badge-old { color: #9c554d; }
  .panel .badge-new { color: #5c7868; }

  /* 模拟侧栏 */
  .sidebar {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fbfaf6;
    padding: 12px;
  }
  .section-label {
    color: var(--text-soft);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 2px 0 8px 2px;
  }
  .topic-list { display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; padding: 0; }

  /* 通用条目 */
  .topic-item {
    align-items: stretch;
    border-radius: var(--radius-sm);
    display: grid;
    gap: 0;
    grid-template-columns: minmax(0, 1fr) auto;
    position: relative;
    transition: background 120ms ease;
    cursor: pointer;
  }
  .topic-item:hover { background: rgba(95, 88, 72, 0.05); }
  .topic-select {
    align-items: start;
    appearance: none;
    background: transparent;
    border: 0;
    border-radius: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    padding: 9px 8px 9px 12px;
    text-align: left;
    width: 100%;
  }
  .topic-title {
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 500;
    line-height: 1.35;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .topic-meta { align-items: center; display: flex; flex: 0 0 auto; gap: 8px; min-width: 0; }
  .topic-time { color: var(--text-soft); font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic-status {
    border-radius: 999px;
    flex: 0 0 auto;
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1;
    padding: 3px 7px;
    white-space: nowrap;
  }
  .topic-status.completed { background: rgba(77, 122, 94, 0.12); color: #4d7a5e; }
  .topic-status.partial_completed { background: rgba(160, 124, 63, 0.12); color: #8a6d3f; }
  .topic-status.failed { background: rgba(168, 90, 82, 0.12); color: #9c554d; }
  .topic-actions { align-items: center; display: flex; gap: 2px; padding-right: 6px; }
  .topic-actions button {
    align-items: center;
    appearance: none;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-soft);
    cursor: pointer;
    display: inline-flex;
    height: 26px;
    justify-content: center;
    width: 26px;
    font-size: 13px;
  }
  .topic-actions button:hover { background: rgba(95, 88, 72, 0.08); color: var(--text); }
  .topic-actions .delete:hover { background: rgba(168, 90, 82, 0.1); color: #a85a52; }

  /* ===== 旧版选中态：浅绿底 + 左侧指示条 ===== */
  .panel.old .topic-item.selected {
    background: rgba(126, 155, 138, 0.1);
    box-shadow: inset 2px 0 0 var(--primary);
  }
  .panel.old .topic-item.selected .topic-title { color: var(--primary-pressed); font-weight: 650; }

  /* ===== 新版选中态：整块深色底 ===== */
  .panel.new .topic-item.selected { background: #5c7868; }
  .panel.new .topic-item.selected .topic-title { color: #ffffff; font-weight: 650; }
  .panel.new .topic-item.selected .topic-time { color: rgba(255, 255, 255, 0.72); }
  .panel.new .topic-item.selected .topic-status { background: rgba(255, 255, 255, 0.95); }
  .panel.new .topic-item.selected .topic-status.completed { color: #4d7a5e; }
  .panel.new .topic-item.selected .topic-status.partial_completed { color: #8a6d3f; }
  .panel.new .topic-item.selected .topic-status.failed { color: #9c554d; }
  .panel.new .topic-item.selected .topic-actions button { color: rgba(255, 255, 255, 0.85); }
  .panel.new .topic-item.selected .topic-actions button:hover { background: rgba(255, 255, 255, 0.14); color: #ffffff; }
  .panel.new .topic-item.selected .topic-actions .delete:hover { background: rgba(255, 255, 255, 0.14); color: #f0b8b0; }
</style>
</head>
<body>
  <h1>课题列表 · 选中态改版预览</h1>
  <p class="sub">左边是旧版（浅绿底 + 左侧指示条），右边是本次改动（整块深色底）。点击条目可切换选中项。</p>

  <div class="compare">
    <section class="panel old">
      <h2>旧版 <span class="badge-old">● 指示条方案</span></h2>
      <p class="hint">点击条目切换选中</p>
      <div class="sidebar">
        <p class="section-label">全部课题</p>
        <ul class="topic-list" id="list-old"></ul>
      </div>
    </section>

    <section class="panel new">
      <h2>新版 <span class="badge-new">● 深色块方案</span></h2>
      <p class="hint">点击条目切换选中</p>
      <div class="sidebar">
        <p class="section-label">全部课题</p>
        <ul class="topic-list" id="list-new"></ul>
      </div>
    </section>
  </div>

<script>
  const data = [
    { title: "20260809_195609.mp4", time: "2026年8月11日 18:37", status: "completed", label: "已完成" },
    { title: "线性代数复习课", time: "2026年8月10日 09:12", status: "partial_completed", label: "部分完成" },
    { title: "英语听力精讲", time: "2026年8月9日 20:05", status: "failed", label: "失败" },
  ];

  function render(containerId, initialSelected) {
    const ul = document.getElementById(containerId);
    data.forEach((d, i) => {
      const li = document.createElement("li");
      li.className = "topic-item" + (i === initialSelected ? " selected" : "");

      const btn = document.createElement("button");
      btn.className = "topic-select";
      btn.type = "button";
      btn.innerHTML =
        '<span class="topic-title"></span>' +
        '<span class="topic-meta">' +
        '<span class="topic-time"></span>' +
        '<span class="topic-status ' + d.status + '"></span>' +
        "</span>";
      btn.querySelector(".topic-title").textContent = d.title;
      btn.querySelector(".topic-time").textContent = d.time;
      btn.querySelector(".topic-status").textContent = d.label;

      const actions = document.createElement("div");
      actions.className = "topic-actions";
      const rename = document.createElement("button");
      rename.type = "button";
      rename.title = "重命名";
      rename.innerHTML = "&#9998;";
      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.title = "删除";
      del.innerHTML = "&#128465;";
      actions.append(rename, del);

      li.append(btn, actions);
      li.addEventListener("click", () => {
        ul.querySelectorAll(".topic-item").forEach((el) => el.classList.remove("selected"));
        li.classList.add("selected");
      });
      ul.appendChild(li);
    });
  }

  render("list-old", 0);
  render("list-new", 0);
</script>
</body>
</html>
