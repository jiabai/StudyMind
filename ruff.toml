line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "FA", "PLC", "TRY", "RUF"]
ignore = [
  "E501",      # line length
  "RUF001",    # ambiguous unicode: Chinese fullwidth punctuation is intentional
  "TRY003",    # avoid long raise messages: codebase convention uses string args
  "PLC0415",   # import outside top-level: lazy imports for optional deps
]

[format]
quote-style = "double"
indent-style = "space"